services:
  - type: web
    name: ring-of-12-api
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      # REQUIRED: server.js reads LLM_API_KEY (primary provider, intended: MiMo).
      - key: LLM_API_KEY
        sync: false
      - key: PORT
        value: "3000"
